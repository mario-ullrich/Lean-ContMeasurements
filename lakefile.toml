name = "contmeasurements"
defaultTargets = ["ContMeasurements", "BasicResults"]

# As Mathlib does for itself: an unknown identifier in a statement is an error.
[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

# Mathlib pinned to the v4.36.0 tag, matching lean-toolchain: a release tag has a
# fully-published build cache, so `lake exe cache get` finds every olean.
[[require]]
name = "mathlib"
scope = "leanprover-community"
version = "git#v4.36.0"

# The general ingredients the theory consumes: Borsuk–Ulam, split covers, the halving
# lemma, colored covers, the Lebesgue cover of R^m. Nothing here mentions measurements,
# and it uses root namespaces as a Mathlib contribution would.
[[lean_lib]]
name = "BasicResults"

[[lean_lib]]
name = "ContMeasurements"

# Submission surfaces for the Palomar registry, one directory per result.
# Kept out of `defaultTargets` on purpose: a plain `lake build` never compiles the
# Challenge modules, whose `sorry` placeholders are required by the submission format.
# Build them explicitly with `lake build Palomar`.
#
# The globs make every module under `Palomar/` its own root. A Challenge and its Solution
# must not meet in one environment: the Challenge repeats the definitions that the Solution
# gets from `ContMeasurements`, so importing both would declare them twice, and Comparator
# likewise compiles the two separately.
#
# `Palomar` is listed alongside `Palomar.+` because the `.+` form builds the submodules
# only. The root imports nothing.
[[lean_lib]]
name = "Palomar"
globs = ["Palomar", "Palomar.+"]
